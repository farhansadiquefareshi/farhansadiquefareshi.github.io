<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Farhan Sadique | Portfolio</title>
  <style>
    :root {
      --text-main: #f0f6fc;
      --text-muted: #b1bac4;
      --accent: #58a6ff;
      --glass-bg: rgba(13, 17, 23, 0.72);
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      background-color: #0d1117;
      /* Background GIF: Change to 'bg.gif' if you uploaded it locally, or keep the URL */
      background-image: linear-gradient(rgba(10, 14, 20, 0.65), rgba(10, 14, 20, 0.85)),
                        url('https://cdn.dribbble.com/userupload/20729449/file/original-01f8b00edfb01b7fdd0b830b5df7eb42.gif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 4rem 1.5rem;
    }

    /* Glassmorphism Header & Sections */
    header, section {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .subtitle {
      color: var(--accent);
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 1rem;
    }

    .bio {
      color: var(--text-muted);
      max-width: 680px;
      font-size: 1rem;
    }

    h2 {
      font-size: 1.4rem;
      margin-bottom: 1.2rem;
      padding-left: 0.5rem;
      border-left: 4px solid var(--accent);
    }

    /* Project Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: rgba(22, 27, 34, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card h3 {
      font-size: 1.15rem;
      margin-bottom: 0.6rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 1.2rem;
    }

    .tags {
      display
